events {}

http {
  # Docker Compose's embedded DNS resolves "api" to every healthy replica.
  # least_conn sends new bookings/scans to whichever instance is least busy —
  # better than round-robin when scan traffic bursts unevenly across replicas.
  upstream midway_api {
    least_conn;
    server api:3001;
  }

  server {
    listen 80;

    location / {
      proxy_pass http://midway_api;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }
}
