version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: midway_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB:       ${POSTGRES_DB:-midwayticket}
      POSTGRES_USER:     ${POSTGRES_USER:-midway}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-midway_secret}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U midway -d midwayticket"]
      interval: 10s
      timeout: 5s
      retries: 5
  
  redis:
    image: redis:7-alpine
    container_name: midway_redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-redis_secret} --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    # No fixed container_name / host port mapping — required so this service
    # can be scaled to N replicas (`docker compose up --scale api=3`).
    # Two named instances can't both bind 3001 on the host or share one
    # container_name; nginx below is what the outside world talks to.
    expose:
      - "3001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
    deploy:
      replicas: 2          # horizontal scaling: bump this as load grows

  # Load balancer in front of the API replicas. Round-robins requests across
  # every `api` instance Docker's internal DNS resolves for the name `api`.
  nginx:
    image: nginx:1.27-alpine
    container_name: midway_nginx
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "3001:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro

volumes:
  postgres_data:
  redis_data:
